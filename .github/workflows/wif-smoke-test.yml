name: WIF smoke test

on:
  workflow_dispatch:
  push:
    branches: [wif-test]
    paths:
      - '.github/workflows/wif-smoke-test.yml'
      - 'scripts/wif-smoke-test.mjs'
      - 'supabase/functions/_shared/google-wif.ts'

permissions:
  contents: read
  id-token: write

jobs:
  google-api-smoke-test:
    if: github.ref == 'refs/heads/wif-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exchange GitHub OIDC through Google WIF and check read-only APIs
        env:
          GOOGLE_WIF_AUDIENCE: ${{ vars.GOOGLE_WIF_AUDIENCE }}
          GOOGLE_WIF_SERVICE_ACCOUNT_EMAIL: ${{ vars.GOOGLE_WIF_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_FILE_ID: ${{ vars.GOOGLE_DRIVE_FILE_ID }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TEST_RANGE: ${{ vars.GOOGLE_SHEET_TEST_RANGE }}
          GOOGLE_SHEET_EXPECTED_VALUE: ${{ vars.GOOGLE_SHEET_EXPECTED_VALUE }}
        run: |
          node --experimental-strip-types scripts/wif-smoke-test.mjs
          node --experimental-strip-types scripts/wif-smoke-test.mjs
